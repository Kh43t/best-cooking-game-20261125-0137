<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
<title>Warung Senja — Dapur Kilat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #160826;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    color: #fff6e3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
  }
  #wrap {
    width: min(1280px, 100%);
    border: 3px solid #8a5a33;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
    background: #2b1a4d;
  }
  #hint {
    font-size: 14px;
    color: #cbb7e8;
    text-align: center;
  }
  #foot { font-size: 12px; color: #8a76b8; text-align: center; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <p id="hint"></p>
  <p id="foot">Warung Senja — Dapur Kilat · game masak orisinal · semua gambar &amp; suara dibuat di dalam game, tanpa file eksternal</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
